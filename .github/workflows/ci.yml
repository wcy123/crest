name: CI

on:
  push:
    branches: [main]       # verify post-merge on main
  pull_request:
    branches: [main]       # verify PRs before merge

env:
  # samples/ contains example passes (e.g. hip-fusion).
  # The interpreter finds them via CREST_PATH at runtime.
  CREST_PATH: ${{ github.workspace }}/samples

jobs:
  linux:
    name: Build and Test — Linux (LLVM ${{ matrix.llvm }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 22 is the baseline; 23 adds DynamicOpDefinition::addTrait (tests marked REQUIRES: llvm-23).
        llvm: [22, 23]

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── LLVM / MLIR (pre-built) ──────────────────────────────────────────────
      - name: Install LLVM/MLIR from apt.llvm.org
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ matrix.llvm }} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }}-dev \
            libmlir-${{ matrix.llvm }}-dev mlir-${{ matrix.llvm }}-tools

      # ── System packages (ChezScheme build deps) ─────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            uuid-dev \
            libgtest-dev \
            googletest \
            emacs-nox \
            ccache

      # ── Python tools ────────────────────────────────────────────────────────
      - name: Install Python build tools
        run: pip install cmake ninja lit

      # ── ccache ──────────────────────────────────────────────────────────────
      # ccache comes from apt (installed above), not from a download of a GitHub release: the
      # sccache action failed the job whenever that download returned a 5xx. Every run saves its
      # cache under its own key and restores the most recent one, so the objects of a commit are
      # there for the next commit (a key per day would only keep what the first run of the day built).
      - name: Set ccache environment
        run: |
          echo "CCACHE_DIR=${{ runner.workspace }}/ccache-dir" >> $GITHUB_ENV
          echo "CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV

      - name: Restore ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/ccache-dir
          key: ccache-linux-${{ matrix.llvm }}-${{ github.run_id }}
          restore-keys: ccache-linux-${{ matrix.llvm }}-

      - name: Reset ccache statistics
        run: ccache --zero-stats

      # ── Cache ChezScheme build ───────────────────────────────────────────────
      # Key on deps.cmake so cache invalidates when GIT_TAG or build flags change.
      # Caches source, compiled artifacts, and ExternalProject stamps so cmake
      # skips the ~4 min ChezScheme configure+build on subsequent runs.
      - name: Cache ChezScheme
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/chezscheme-src
            build/ChezScheme-build
            build/ChezScheme-prefix/src/ChezScheme-stamp
          key: chezscheme-linux-${{ hashFiles('cmake/deps.cmake') }}

      # ── Configure ───────────────────────────────────────────────────────────
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-${{ matrix.llvm }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ matrix.llvm }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DMLIR_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(which lit)"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.workspace }}/ccache-dir
          key: ccache-linux-${{ matrix.llvm }}-${{ github.run_id }}

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Unit tests
        run: |
          cmake --build build --target CrestInterpreterTests
          ./build/unittests/Interpreter/CrestInterpreterTests \
            --gtest_output=xml:build/test-results/unit-tests.xml

      - name: Lit tests
        run: cmake --build build --target check-crest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux-llvm${{ matrix.llvm }}
          path: build/test-results/

  windows:
    name: Build and Test — Windows (LLVM ${{ matrix.llvm }}, self-hosted)
    runs-on: [self-hosted, Windows, X64, msvc]
    strategy:
      fail-fast: false
      max-parallel: 1   # the jobs share C:\Develop\crest-deps
      matrix:
        # Both are built from source on the runner (the llvm-windows workflow).
        llvm: [22, 23]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Configure ───────────────────────────────────────────────────────────────
      # build\ is wiped each run to avoid stale CMakeCache and git ownership issues.
      # FETCHCONTENT_BASE_DIR + CHEZ_BUILD_DIR keep ChezScheme source/build/stamps
      # in C:\Develop\crest-deps so they survive the wipe (first run builds Chez,
      # subsequent runs skip it — saves ~5 min). FETCHCONTENT_UPDATES_DISCONNECTED
      # skips the git update step on cache hits.
      # Note: sccache with MSVC RelWithDebInfo causes C1041/C1090 PDB contention
      # (multiple cl.exe writing to the same .pdb). Omitting sccache for Windows
      # until a clean solution is found; ChezScheme caching already cuts most time.
      - name: Configure
        shell: cmd
        run: |
          rmdir /s /q build 2>nul
          git config --global --add safe.directory C:/Develop/crest-deps/chezscheme-src
          call C:\msvsn2022\VC\Auxiliary\Build\vcvars64.bat
          cmake -B build -G Ninja ^
            -DFETCHCONTENT_BASE_DIR=C:\Develop\crest-deps ^
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON ^
            -DCHEZ_BUILD_DIR=C:\Develop\crest-deps\chezscheme-build ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DCMAKE_PREFIX_PATH=C:\Develop\local ^
            -DMLIR_DIR=C:\Develop\local\llvm-${{ matrix.llvm }}-mlir\lib\cmake\mlir ^
            -DLLVM_DIR=C:\Develop\local\llvm-${{ matrix.llvm }}-mlir\lib\cmake\llvm ^
            -DLLVM_EXTERNAL_LIT=C:\ProgramData\miniconda3\Scripts\lit.exe

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        shell: cmd
        run: |
          call C:\msvsn2022\VC\Auxiliary\Build\vcvars64.bat
          cmake --build build --parallel 60

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Unit tests
        shell: cmd
        run: |
          cmake --build build --target CrestInterpreterTests
          build\unittests\Interpreter\CrestInterpreterTests.exe ^
            --gtest_output=xml:build/test-results/unit-tests.xml

      - name: Lit tests
        shell: cmd
        env:
          CREST_PATH: ${{ github.workspace }}/samples
        run: |
          call C:\msvsn2022\VC\Auxiliary\Build\vcvars64.bat
          cmake --build build --target check-crest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-llvm${{ matrix.llvm }}
          path: build/test-results/
