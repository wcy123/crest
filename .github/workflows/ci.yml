name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

env:
  LLVM_TAG: llvmorg-22.1.0
  LLVM_INSTALL: ${{ github.workspace }}/../llvm-install

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        # third_party/ is populated via git subtree — plain checkout suffices

      # ── Python tools ────────────────────────────────────────────────────────
      - name: Install Python build tools
        run: python3 -m pip install cmake ninja lit

      # ── System packages ─────────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            uuid-dev \
            git

      # ── sccache ─────────────────────────────────────────────────────────────
      - name: Set sccache environment
        run: |
          echo "SCCACHE_DIR=${{ runner.workspace }}/sccache-dir" >> $GITHUB_ENV
          echo "SCCACHE_KEY_DATE=$(date -u +'%Y%m%d')" >> $GITHUB_ENV

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-linux-${{ env.SCCACHE_KEY_DATE }}
          restore-keys: sccache-linux-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # ── LLVM / MLIR (cached from source) ────────────────────────────────────
      - name: Cache LLVM install
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_INSTALL }}
          key: linux-llvm-${{ env.LLVM_TAG }}
          restore-keys: |
            linux-llvm-

      - name: Build LLVM/MLIR from source
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="${{ runner.workspace }}/llvm-project"
          git clone --depth 1 --branch "${{ env.LLVM_TAG }}" \
            https://github.com/llvm/llvm-project.git "$SRC"
          cmake -G Ninja -S "$SRC/llvm" -B "${{ runner.workspace }}/build-llvm" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ env.LLVM_INSTALL }}" \
            -DLLVM_ENABLE_PROJECTS="clang;mlir" \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_RTTI=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INSTALL_UTILS=ON \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build "${{ runner.workspace }}/build-llvm" --target install
          rm -rf "$SRC" "${{ runner.workspace }}/build-llvm"

      # ── Save sccache ─────────────────────────────────────────────────────────
      - name: Save sccache cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.workspace }}/sccache-dir
          key: sccache-linux-${{ env.SCCACHE_KEY_DATE }}

      # ── Configure CREST ──────────────────────────────────────────────────────
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="${{ env.LLVM_INSTALL }}/bin/clang" \
            -DCMAKE_CXX_COMPILER="${{ env.LLVM_INSTALL }}/bin/clang++" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DMLIR_DIR="${{ env.LLVM_INSTALL }}/lib/cmake/mlir" \
            -DLLVM_DIR="${{ env.LLVM_INSTALL }}/lib/cmake/llvm" \
            -DLLVM_EXTERNAL_LIT="$(which lit)"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build --parallel $(nproc)

      # ── Unit tests (GoogleTest) ───────────────────────────────────────────────
      - name: Unit tests
        run: |
          cmake --build build --target CrestInterpreterTests
          ./build/unittests/Interpreter/CrestInterpreterTests \
            --gtest_output=xml:build/test-results/unit-tests.xml

      # ── Integration tests (lit + FileCheck) ───────────────────────────────────
      - name: Lit tests
        run: cmake --build build --target check-crest

      # ── Upload test results ───────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/
