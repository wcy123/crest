name: Build LLVM/MLIR on Windows

# Manual. Builds LLVM and MLIR from source on the self-hosted Windows runner and installs them
# next to the existing ones, so the CI job can use them (C:\Develop\local\llvm-<version>-mlir).
# Settings follow the Linux packages: Release, X86 only, no RTTI, no exceptions, no assertions,
# and the static release CRT (/MT) that the CREST job builds with (CMAKE_MSVC_RUNTIME_LIBRARY;
# LLVM 23 ignores the old LLVM_USE_CRT_RELEASE, and a /MD build fails to link with __imp_ errors).

on:
  workflow_dispatch:
    inputs:
      llvm_tag:
        description: "llvm-project tag to build"
        default: "llvmorg-23.1.5"
      install_dir:
        description: "install prefix"
        default: 'C:\Develop\local\llvm-23-mlir'

jobs:
  build:
    name: Build LLVM/MLIR (Windows, self-hosted)
    runs-on: [self-hosted, Windows, X64, msvc]
    timeout-minutes: 600

    steps:
      - name: Show the installed LLVM 22 settings for comparison
        shell: powershell
        run: |
          $cfg = 'C:\Develop\local\llvm-22-mlir\lib\cmake\llvm\LLVMConfig.cmake'
          if (Test-Path $cfg) { Select-String -Path $cfg -Pattern 'LLVM_ENABLE_(ASSERTIONS|RTTI|EH)|LLVM_TARGETS_TO_BUILD|LLVM_BUILD_TYPE|LLVM_USE_CRT' }
          else { "no LLVM 22 config at $cfg" }

      - name: Fetch the sources
        shell: cmd
        run: |
          if not exist C:\Develop\build mkdir C:\Develop\build
          if not exist C:\Develop\build\llvm-project-${{ inputs.llvm_tag }} (
            git clone --depth 1 --branch ${{ inputs.llvm_tag }} https://github.com/llvm/llvm-project.git C:\Develop\build\llvm-project-${{ inputs.llvm_tag }}
          )

      - name: Configure
        shell: cmd
        run: |
          rmdir /s /q C:\Develop\build\llvm-${{ inputs.llvm_tag }}-build 2>nul
          call C:\msvsn2022\VC\Auxiliary\Build\vcvars64.bat
          cmake -S C:\Develop\build\llvm-project-${{ inputs.llvm_tag }}\llvm -B C:\Develop\build\llvm-${{ inputs.llvm_tag }}-build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DLLVM_ENABLE_PROJECTS=mlir ^
            -DLLVM_TARGETS_TO_BUILD=X86 ^
            -DLLVM_ENABLE_ASSERTIONS=OFF ^
            -DLLVM_ENABLE_RTTI=OFF ^
            -DLLVM_ENABLE_EH=OFF ^
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded ^
            -DLLVM_ENABLE_ZSTD=OFF ^
            -DLLVM_ENABLE_ZLIB=OFF ^
            -DLLVM_ENABLE_LIBXML2=OFF ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DMLIR_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DMLIR_ENABLE_EXECUTION_ENGINE=ON ^
            -DMLIR_ENABLE_BINDINGS_PYTHON=OFF ^
            -DCMAKE_INSTALL_PREFIX=${{ inputs.install_dir }}

      - name: Build and install
        shell: cmd
        run: |
          call C:\msvsn2022\VC\Auxiliary\Build\vcvars64.bat
          cmake --build C:\Develop\build\llvm-${{ inputs.llvm_tag }}-build --parallel 60
          cmake --install C:\Develop\build\llvm-${{ inputs.llvm_tag }}-build

      - name: Check the install
        shell: powershell
        run: |
          foreach ($f in 'lib\cmake\llvm\LLVMConfig.cmake', 'lib\cmake\mlir\MLIRConfig.cmake') {
            $p = Join-Path '${{ inputs.install_dir }}' $f
            if (-not (Test-Path $p)) { throw "missing $p" }
          }
          "installed to ${{ inputs.install_dir }}"
